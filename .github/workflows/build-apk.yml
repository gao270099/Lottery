name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装系统底层编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev zlib1g-dev autoconf automake \
            libtool pkg-config cmake ninja-build zip unzip

      - name: 安装 Buildozer 及打包工具
        run: |
          pip install --upgrade pip
          pip install --upgrade "cython<3.0"
          pip install --upgrade buildozer virtualenv

      - name: 执行 APK 编译打包
        run: |
          buildozer -v android debug

      - name: 上传编译出的 APK 文件
        uses: actions/upload-artifact@v4
        with:
          name: Lottery-Release-APK
          path: bin/*.apk
          retention-days: 7
